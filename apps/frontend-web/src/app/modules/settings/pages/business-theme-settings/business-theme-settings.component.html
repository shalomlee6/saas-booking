<div class="business-theme-settings-page">
  <h1 class="business-theme-settings-title">Theme settings</h1>
  <p class="business-theme-settings-subtitle">Customize your business appearance.</p>

  <div class="business-theme-settings-card">
    <form [formGroup]="form" (ngSubmit)="save()" class="business-theme-settings-form">
      <div class="business-theme-settings-field">
        <label for="themeMode">Theme</label>
        <select id="themeMode" formControlName="themeMode" class="business-theme-settings-input">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
      <div class="business-theme-settings-field">
        <label for="primaryColor">Primary color</label>
        <input id="primaryColor" type="text" formControlName="primaryColor" class="business-theme-settings-input" placeholder="#3787F6" />
      </div>
      <div class="business-theme-settings-field">
        <label for="sidebarColor">Sidebar color</label>
        <input id="sidebarColor" type="text" formControlName="sidebarColor" class="business-theme-settings-input" placeholder="#0F172A" />
      </div>
      @if (error()) {
        <p class="business-theme-settings-error">{{ error() }}</p>
      }
      <div class="business-theme-settings-actions">
        <button type="submit" class="business-theme-settings-btn business-theme-settings-btn-primary" [disabled]="saving()">
          {{ saving() ? 'Saving…' : 'Save' }}
        </button>
        <a routerLink="/dashboard" class="business-theme-settings-btn business-theme-settings-btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
