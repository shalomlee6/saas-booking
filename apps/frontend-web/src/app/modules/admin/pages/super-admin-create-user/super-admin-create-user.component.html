<p-toast />
<div class="sa-create">
  <a routerLink="/super-admin/users" class="sa-create__back">← Back to users</a>
  <h1 class="sa-create__title">Create a new business owner</h1>
  <p class="sa-create__sub">The system will automatically provision everything needed.</p>

  <div class="sa-create__grid">
    <section class="sa-create__panel">
      <h2 class="sa-create__section-title">Business details</h2>
      <label class="sa-create__field">
        <span>Business name *</span>
        <input
          pInputText
          class="sa-create__input"
          [value]="businessName()"
          (input)="onBusinessNameInput($any($event.target).value)"
          [class.sa-create__input--err]="submitAttempted() && fieldError().businessName"
          autocomplete="organization"
        />
        @if (submitAttempted() && fieldError().businessName) {
          <span class="sa-create__err">{{ fieldError().businessName }}</span>
        }
      </label>
      <label class="sa-create__field">
        <span>URL slug *</span>
        <input
          pInputText
          class="sa-create__input"
          [value]="slugInput()"
          (input)="onSlugInput($any($event.target).value)"
          [class.sa-create__input--err]="submitAttempted() && fieldError().slug"
        />
        <p class="sa-create__hint">
          Their link: {{ bookingPreviewBase() }}/b/{{ previewSlug() || '…' }}
        </p>
        <div class="sa-create__slug-status">
          @switch (slugCheck()) {
            @case ('checking') {
              <span class="sa-create__slug-muted">Checking…</span>
            }
            @case ('ok') {
              <span class="sa-create__slug-ok">✓ Available</span>
            }
            @case ('bad') {
              <span class="sa-create__slug-bad">✗ Taken</span>
            }
            @case ('invalid') {
              <span class="sa-create__slug-bad">✗ Too short</span>
            }
            @default {
              <span class="sa-create__slug-muted"></span>
            }
          }
        </div>
        @if (submitAttempted() && fieldError().slug) {
          <span class="sa-create__err">{{ fieldError().slug }}</span>
        }
        <button type="button" class="sa-create__linkish" (click)="regenerateSlugFromName()">
          Regenerate from name
        </button>
      </label>
      <label class="sa-create__field">
        <span>Timezone</span>
        <p-select
          [options]="timezoneOptions"
          [ngModel]="timezone()"
          (ngModelChange)="timezone.set($event)"
          optionLabel="label"
          optionValue="value"
          styleClass="sa-create__select"
        />
      </label>
    </section>

    <section class="sa-create__panel">
      <h2 class="sa-create__section-title">Owner details</h2>
      <label class="sa-create__field">
        <span>Full name *</span>
        <input
          pInputText
          class="sa-create__input"
          [value]="ownerName()"
          (input)="ownerName.set($any($event.target).value)"
          [class.sa-create__input--err]="submitAttempted() && fieldError().ownerName"
          autocomplete="name"
        />
        @if (submitAttempted() && fieldError().ownerName) {
          <span class="sa-create__err">{{ fieldError().ownerName }}</span>
        }
      </label>
      <label class="sa-create__field">
        <span>Email *</span>
        <input
          pInputText
          class="sa-create__input"
          [value]="ownerEmail()"
          (input)="ownerEmail.set($any($event.target).value)"
          [class.sa-create__input--err]="submitAttempted() && fieldError().ownerEmail"
          autocomplete="email"
          type="email"
        />
        @if (submitAttempted() && fieldError().ownerEmail) {
          <span class="sa-create__err">{{ fieldError().ownerEmail }}</span>
        }
      </label>
      <label class="sa-create__field">
        <span>Phone</span>
        <input
          pInputText
          class="sa-create__input"
          [value]="ownerPhone()"
          (input)="ownerPhone.set($any($event.target).value)"
          autocomplete="tel"
        />
      </label>
      <label class="sa-create__field">
        <span>Temporary password *</span>
        <div class="sa-create__pw-row">
          <input
            pInputText
            class="sa-create__input sa-create__input--grow"
            [type]="passwordVisible() ? 'text' : 'password'"
            [value]="ownerPassword()"
            (input)="ownerPassword.set($any($event.target).value)"
            [class.sa-create__input--err]="submitAttempted() && fieldError().password"
            autocomplete="new-password"
          />
          <button type="button" class="sa-create__ghost" (click)="togglePasswordVisible()">
            {{ passwordVisible() ? 'Hide' : 'Show' }}
          </button>
        </div>
        <button type="button" class="sa-create__linkish" (click)="regeneratePassword()">
          Generate password 🔄
        </button>
        @if (submitAttempted() && fieldError().password) {
          <span class="sa-create__err">{{ fieldError().password }}</span>
        }
      </label>
    </section>
  </div>

  <section class="sa-create__plans" aria-label="Choose a plan">
    <h2 class="sa-create__section-title sa-create__section-title--full">Plan</h2>
    <div class="sa-create__plan-grid">
      <button
        type="button"
        class="sa-create__plan"
        [class.sa-create__plan--active]="selectedPlan() === 'free'"
        (click)="selectPlan('free')"
      >
        <span class="sa-create__plan-name">Free</span>
        <span class="sa-create__plan-price">{{ 0 | saCurrency }}/mo</span>
        <ul class="sa-create__plan-list">
          <li>✓ 1 staff member</li>
          <li>✓ 2 services</li>
          <li>✗ Analytics</li>
          <li>✗ Custom domain</li>
        </ul>
      </button>
      <button
        type="button"
        class="sa-create__plan sa-create__plan--popular"
        [class.sa-create__plan--active]="selectedPlan() === 'pro'"
        (click)="selectPlan('pro')"
      >
        <span class="sa-create__plan-badge">Most popular</span>
        <span class="sa-create__plan-name">Pro ⭐</span>
        <span class="sa-create__plan-price">{{ 99 | saCurrency }}/mo</span>
        <ul class="sa-create__plan-list">
          <li>✓ 5 staff members</li>
          <li>✓ 10 services</li>
          <li>✓ Analytics</li>
          <li>✗ Custom domain</li>
        </ul>
      </button>
      <button
        type="button"
        class="sa-create__plan"
        [class.sa-create__plan--active]="selectedPlan() === 'premium'"
        (click)="selectPlan('premium')"
      >
        <span class="sa-create__plan-name">Premium 👑</span>
        <span class="sa-create__plan-price">{{ 199 | saCurrency }}/mo</span>
        <ul class="sa-create__plan-list">
          <li>✓ Unlimited staff</li>
          <li>✓ Unlimited services</li>
          <li>✓ All features</li>
          <li>✓ Custom domain</li>
        </ul>
      </button>
    </div>
  </section>

  <p-button
    label="Create business and owner"
    styleClass="sa-create__submit"
    [loading]="submitting()"
    (onClick)="onSubmit()"
  />
</div>
