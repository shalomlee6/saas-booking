<p-toast />

<div class="sa-page">
  <header class="sa-page-head">
    <h1 class="sa-page-title">Audit log</h1>
    <p class="sa-page-sub">Security-relevant actions across the platform.</p>
  </header>

  <div class="sa-toolbar">
    <input
      pInputText
      type="search"
      [(ngModel)]="searchInput"
      (keyup.enter)="onSearchSubmit()"
      placeholder="Search actor, action, entity id…"
      class="sa-search"
      aria-label="Search audit log"
    />
    <p-button label="Search" (onClick)="onSearchSubmit()" />
  </div>

  <p-table
    [value]="rows()"
    [lazy]="true"
    (onLazyLoad)="onLazyLoad($event)"
    [paginator]="true"
    [rows]="pageSize"
    [totalRecords]="totalRecords()"
    [loading]="loading()"
    [rowsPerPageOptions]="[10, 25, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} of {totalRecords}"
    [tableStyle]="{ 'min-width': '52rem' }"
    styleClass="sa-table"
  >
    <ng-template #header>
      <tr>
        <th>Time</th>
        <th>Actor</th>
        <th>Action</th>
        <th>Entity</th>
        <th>Entity id</th>
        <th>Metadata</th>
      </tr>
    </ng-template>
    <ng-template #body let-row>
      <tr>
        <td>{{ row.timestamp | date: 'medium' }}</td>
        <td>{{ row.actor }}</td>
        <td><code class="sa-code">{{ row.action }}</code></td>
        <td>{{ row.entity }}</td>
        <td><code class="sa-code">{{ row.entityId }}</code></td>
        <td class="sa-meta">{{ row.metadata | json }}</td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="6" class="sa-empty">No audit entries yet.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
