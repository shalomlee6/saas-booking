<div class="login-page">
  <div class="login-card">
    <header class="login-card-header">
      <h1 class="login-card-title">Welcome back</h1>
      <p class="login-card-subtitle">Sign in to your account</p>
    </header>

    <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="login-form-field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          class="login-input"
          [class.login-input-invalid]="email?.invalid && (email?.touched || email?.dirty)"
        />
        <p
          *ngIf="email?.invalid && (email?.touched || email?.dirty)"
          class="login-form-error"
        >
          Please enter a valid email address.
        </p>
      </div>

      <div class="login-form-field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="login-input"
          [class.login-input-invalid]="password?.invalid && (password?.touched || password?.dirty)"
        />
        <!-- <p
          *ngIf="password?.invalid && (password?.touched || password?.dirty)"
          class="login-form-error"
        >
          Password must be at least 6 characters.
        </p> -->
      </div>

      <button
        type="submit"
        class="login-form-submit"
        [disabled]="form.invalid || loading()"
      >
        <span *ngIf="!loading()">Login</span>
        <span *ngIf="loading()">Signing in…</span>
      </button>

      <div class="login-form-forgot-wrap">
        <button type="button" class="login-form-forgot" tabindex="-1">
          Forgot password?
        </button>
      </div>

      <p *ngIf="errorMessage()" class="login-form-error login-form-error-global">
        {{ errorMessage() }}
      </p>
    </form>
  </div>
</div>
