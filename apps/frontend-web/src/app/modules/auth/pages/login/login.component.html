<div class="login-page">
  <div class="login-card">
    <header class="login-card-header">
      <h1 class="login-card-title">Welcome back</h1>
      <p class="login-card-subtitle">Sign in to your account</p>
    </header>

    <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="login-form-field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          class="login-input"
          [class.login-input-invalid]="email?.invalid && (email?.touched || email?.dirty)"
        />
        @if (email?.invalid && (email?.touched || email?.dirty)) {
        <p class="login-form-error">Please enter a valid email address.</p>
      }
      </div>

      <div class="login-form-field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          class="login-input"
          [class.login-input-invalid]="password?.invalid && (password?.touched || password?.dirty)"
        />
        @if (password?.invalid && (password?.touched || password?.dirty)) {
          <p class="login-form-error">Password must be at least 4 characters.</p>
        }
      </div>

      <button
        type="submit"
        class="login-form-submit"
        [disabled]="form.invalid || loading()"
      >
        @if (loading()) { Signing in… } @else { Login }
      </button>

      <div class="login-form-forgot-wrap">
        <button
          type="button"
          class="login-form-forgot"
          disabled
          title="Password reset is not available yet"
          aria-label="Forgot password — not available yet"
        >
          Forgot password?
        </button>
      </div>

      @if (errorMessage()) {
        <p class="login-form-error login-form-error-global">{{ errorMessage() }}</p>
      }
    </form>
  </div>
</div>
