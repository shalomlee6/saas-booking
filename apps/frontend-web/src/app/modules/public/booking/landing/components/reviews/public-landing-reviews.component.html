<section class="pl-rev" aria-labelledby="pl-rev-title">
  <h2 id="pl-rev-title" class="pl-rev__title">מה הלקוחות אומרות</h2>
  <ul class="pl-rev__scroll">
    @for (r of rows(); track r.date + r.customerName + r.text) {
      <li class="pl-rev__card">
        <p class="pl-rev__stars" aria-hidden="true">{{ r.starRow }}</p>
        <p class="pl-rev__text">"{{ r.text }}"</p>
        <p class="pl-rev__meta">
          <span class="pl-rev__name">{{ r.customerName }}</span>
          <span class="pl-rev__dot">·</span>
          <span class="pl-rev__date">{{ r.date | date: 'mediumDate' : undefined : 'he-IL' }}</span>
        </p>
      </li>
    }
  </ul>
</section>
