<section class="pl-next" aria-labelledby="pl-next-heading">
  <h2 id="pl-next-heading" class="pl-next__heading">
    <i class="pi pi-calendar pl-next__heading-ico" aria-hidden="true"></i>
    {{ 'appointments.nextAppointmentHeading' | translate }}
  </h2>

  @if (loading()) {
    <div class="pl-next__card pl-next__card--skeleton">
      <p-skeleton width="55%" height="1.125rem" styleClass="mb-2" />
      <p-skeleton width="70%" height="0.875rem" styleClass="mb-1" />
      <p-skeleton width="45%" height="0.875rem" />
    </div>
  } @else if (apt(); as a) {
    <app-public-appointment-card
      [apt]="a"
      [staffLine]="staffLine()"
      [clickable]="true"
      (open)="open.emit()"
      (edit)="edit.emit()"
    />
  } @else if (error()) {
    <div class="pl-next__card pl-next__card--error">
      <i class="pi pi-exclamation-circle pl-next__err-ico" aria-hidden="true"></i>
      <p class="pl-next__err-msg">{{ 'appointments.upcomingLoadError' | translate }}</p>
    </div>
  } @else {
    <div class="pl-next__empty">
      <span class="pl-next__empty-illu" aria-hidden="true">✨</span>
      <p class="pl-next__empty-title">{{ 'appointments.upcomingEmptyTitle' | translate }}</p>
      <p class="pl-next__empty-sub">{{ 'appointments.upcomingEmptySub' | translate }}</p>
      <p-button
        [label]="'appointments.upcomingBookCta' | translate"
        icon="pi pi-calendar-plus"
        iconPos="right"
        styleClass="pl-next__empty-btn"
        (onClick)="book.emit()"
      />
    </div>
  }
</section>
