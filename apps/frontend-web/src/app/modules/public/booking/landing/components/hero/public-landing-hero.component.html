<div class="pl-hero-wrap" [class.pl-hero-wrap--play-entrance]="playEntrance()">
  <div class="pl-hero-slider pl-hero-entrance-item pl-hero-entrance-item--media">
    <p-carousel
      [value]="carouselSlides()"
      [numVisible]="1"
      [numScroll]="1"
      [circular]="true"
      [showIndicators]="true"
      [showNavigators]="false"
      styleClass="pl-hero-carousel"
    >
      <ng-template let-src pTemplate="item">
        <div class="pl-hero-carousel__slide">
          <img
            class="pl-hero-carousel__img"
            [src]="src"
            alt=""
            width="800"
            height="400"
            loading="lazy"
            decoding="async"
          />
        </div>
      </ng-template>
    </p-carousel>
  </div>

  <div class="pl-hero-intro" dir="rtl">
    <p class="pl-hero-intro__name pl-hero-entrance-item pl-hero-entrance-item--brand">
      {{ businessName() }}
    </p>
    <p class="pl-hero-intro__tagline pl-hero-entrance-item pl-hero-entrance-item--copy">
      {{ tagline() }}
    </p>
    @if (description().trim()) {
      <p class="pl-hero-intro__desc pl-hero-entrance-item pl-hero-entrance-item--copy">
        {{ description() }}
      </p>
    }
    <p-button
      label="קביעת תור"
      icon="pi pi-calendar-plus"
      iconPos="right"
      styleClass="pl-hero-intro__cta pl-hero-entrance-item pl-hero-entrance-item--cta"
      (onClick)="book.emit()"
    />
  </div>
</div>
