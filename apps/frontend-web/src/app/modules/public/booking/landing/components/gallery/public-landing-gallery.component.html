<section class="pl-gal" aria-labelledby="pl-gal-title">
  <div class="pl-gal__head">
    <h2 id="pl-gal-title" class="pl-gal__title pl-intro-text pl-intro-text--6">{{ 'publicLanding.galleryTitle' | translate }}</h2>
    @if (isOwner()) {
      <p-button
        [label]="'publicLanding.addPhoto' | translate"
        icon="pi pi-plus"
        iconPos="right"
        [outlined]="true"
        styleClass="pl-gal__add"
        (onClick)="openAddDialog()"
      />
    }
  </div>

  @if (items().length === 0) {
    <p class="pl-gal__empty-line">{{ 'publicLanding.galleryEmpty' | translate }}</p>
  } @else {
    <div class="pl-gal__masonry">
      @for (item of items(); track item.id; let idx = $index) {
        <button
          type="button"
          class="pl-gal__thumb"
          (click)="openLightbox(idx)"
        >
          <img
            [src]="displaySrc(item.imageUrl)"
            [alt]="item.title?.trim() ? item.title! : ('publicLanding.galleryAlt' | translate: { n: idx + 1 })"
            loading="lazy"
            decoding="async"
          />
          @if (item.title?.trim()) {
            <span class="pl-gal__thumb-cap">{{ item.title }}</span>
          }
        </button>
      }
    </div>
  }
</section>

<p-dialog
  [visible]="lightboxOpen()"
  (visibleChange)="lightboxOpen.set($event)"
  [modal]="true"
  [dismissableMask]="true"
  [style]="{ width: '100vw', maxWidth: '100vw', height: '100vh' }"
  [closeAriaLabel]="'publicLanding.closePhoto' | translate"
  styleClass="pl-gal__lightbox"
  [contentStyle]="{ padding: 0 }"
>
  @if (lightboxSrc(); as s) {
    <figure class="pl-gal__lightbox-fig">
      <img [src]="s" alt="" class="pl-gal__lightbox-img" loading="lazy" />
      @if (lightboxTitle()) {
        <figcaption class="pl-gal__lightbox-cap">{{ lightboxTitle() }}</figcaption>
      }
    </figure>
  }
</p-dialog>

<p-dialog
  [header]="'publicLanding.addPhotoTitle' | translate"
  [visible]="addDialogOpen()"
  (visibleChange)="addDialogOpen.set($event)"
  [modal]="true"
  [style]="{ width: '22rem' }"
  [closeAriaLabel]="'publicLanding.close' | translate"
  [dismissableMask]="true"
>
  <div class="pl-gal__form">
    <label class="pl-gal__label">
      {{ 'publicLanding.photoUrl' | translate }}
      <input
        pInputText
        class="pl-gal__input"
        [ngModel]="urlDraft()"
        (ngModelChange)="urlDraft.set($event)"
        placeholder="https://..."
      />
    </label>
    <p-button
      [label]="'common.save' | translate"
      icon="pi pi-check"
      iconPos="right"
      styleClass="pl-gal__save"
      (onClick)="submitNewImage()"
    />
  </div>
</p-dialog>
