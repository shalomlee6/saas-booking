<section class="pl-cta" aria-label="קביעת תור">
  <h2 class="pl-cta__title">מוכנה לטיפול הבא שלך?</h2>
  <p class="pl-cta__sub">קביעת תור פשוטה, מהירה ובלחיצה אחת</p>
  <p-button
    label="קביעי תור עכשיו"
    icon="pi pi-calendar-plus"
    iconPos="right"
    styleClass="pl-cta__btn"
    (onClick)="book.emit()"
  />
  <div class="pl-cta__links">
    @if (phoneHref(); as href) {
      <a class="pl-cta__link" [href]="href">התקשרי: {{ phone() }}</a>
    }
    @if (whatsappHref(); as wa) {
      <a class="pl-cta__link" [href]="wa" target="_blank" rel="noopener noreferrer">וואטסאפ</a>
    }
    @if (emailHref(); as em) {
      <a class="pl-cta__link" [href]="em">אימייל</a>
    }
    @if (location(); as loc) {
      @if (loc.trim()) {
        <p class="pl-cta__loc">{{ loc }}</p>
      }
    }
  </div>
</section>
