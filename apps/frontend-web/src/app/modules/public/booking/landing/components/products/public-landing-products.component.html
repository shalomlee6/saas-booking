<section class="pl-prod" aria-labelledby="pl-prod-title">
  <h2 id="pl-prod-title" class="pl-prod__title">הטיפולים המומלצים</h2>
  <ul class="pl-prod__scroll">
    @for (p of products(); track p.name + p.price) {
      <li class="pl-prod__card">
        <h3 class="pl-prod__name">{{ p.name }}</h3>
        @if (p.description) {
          <p class="pl-prod__desc">{{ p.description }}</p>
        }
        <p class="pl-prod__price">{{ p.price | currency: 'ILS' : 'symbol' : '1.0-0' }}</p>
      </li>
    }
  </ul>
</section>
