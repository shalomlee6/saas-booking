<div class="customer-site-preview">
  <div class="customer-site-preview-toolbar">
    <div class="customer-site-preview-heading">
      <h1 class="customer-site-preview-title">{{ 'navigation.previewTitle' | translate }}</h1>
      <p class="customer-site-preview-subtitle">{{ 'navigation.previewSubtitle' | translate }}</p>
    </div>
    <div
      class="customer-site-preview-devices"
      role="radiogroup"
      [attr.aria-label]="'navigation.previewDeviceLabel' | translate"
    >
      @for (option of devices; track option.id) {
        <button
          type="button"
          class="customer-site-preview-device"
          role="radio"
          [class.customer-site-preview-device-active]="device() === option.id"
          [attr.aria-checked]="device() === option.id"
          (click)="selectDevice(option.id)"
        >
          <i [class]="option.icon" aria-hidden="true"></i>
          <span>{{ option.labelKey | translate }}</span>
        </button>
      }
    </div>
  </div>

  @if (iframeSrc(); as src) {
    <div class="customer-site-preview-stage" [attr.data-device]="device()">
      <div class="customer-site-preview-frame" [style.width]="frameWidth()">
        <iframe
          [src]="src"
          class="customer-site-preview-iframe"
          [title]="'navigation.previewTitle' | translate"
        ></iframe>
      </div>
    </div>
  } @else {
    <div class="customer-site-preview-warning">
      <p>{{ 'navigation.previewNoSlug' | translate }}</p>
    </div>
  }
</div>
