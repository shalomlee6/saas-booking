<header class="public-nav-topbar" role="banner">
  <button
    #menuBtn
    type="button"
    class="public-nav-menu-btn"
    [attr.aria-label]="menuAriaLabel()"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-controls]="'public-customer-nav'"
    (click)="toggleMenu()"
  >
    <i [class]="menuToggleIcon()" aria-hidden="true"></i>
  </button>
  <span class="public-nav-topbar-title">boki</span>
</header>

<div
  class="public-nav-backdrop"
  [class.public-nav-backdrop-open]="menuOpen()"
  (click)="closeMenu()"
  aria-hidden="true"
></div>

<aside
  class="public-nav-sidebar"
  [class.public-nav-sidebar-open]="menuOpen()"
  [attr.aria-hidden]="!menuOpen()"
  [inert]="!menuOpen()"
>
  <nav
    id="public-customer-nav"
    class="public-nav-list"
    [attr.aria-label]="'navigation.menu' | translate"
  >
    <a
      #firstLink
      class="public-nav-link"
      [class.public-nav-link-active]="activeItem() === 'home'"
      [routerLink]="['/b', slug()]"
      [attr.aria-current]="activeItem() === 'home' ? 'page' : null"
      (click)="onNavClick()"
    >
      <i class="pi pi-home public-nav-icon" aria-hidden="true"></i>
      <span class="public-nav-label">{{ 'navigation.publicHome' | translate }}</span>
    </a>

    <a
      class="public-nav-link"
      [class.public-nav-link-active]="activeItem() === 'upcoming'"
      [routerLink]="['/b', slug(), 'upcoming']"
      [attr.aria-current]="activeItem() === 'upcoming' ? 'page' : null"
      (click)="onNavClick()"
    >
      <i class="pi pi-calendar public-nav-icon" aria-hidden="true"></i>
      <span class="public-nav-label">{{ 'navigation.publicUpcoming' | translate }}</span>
    </a>

    <a
      class="public-nav-link"
      [class.public-nav-link-active]="activeItem() === 'location'"
      [routerLink]="['/b', slug()]"
      fragment="public-location"
      [attr.aria-current]="activeItem() === 'location' ? 'page' : null"
      (click)="onNavClick()"
    >
      <i class="pi pi-map-marker public-nav-icon" aria-hidden="true"></i>
      <span class="public-nav-label">{{ 'navigation.publicLocation' | translate }}</span>
    </a>

    <a
      class="public-nav-link"
      [class.public-nav-link-active]="activeItem() === 'settings'"
      [routerLink]="['/b', slug(), 'settings']"
      [attr.aria-current]="activeItem() === 'settings' ? 'page' : null"
      (click)="onNavClick()"
    >
      <i class="pi pi-cog public-nav-icon" aria-hidden="true"></i>
      <span class="public-nav-label">{{ 'navigation.settings' | translate }}</span>
    </a>

    <button type="button" class="public-nav-link public-nav-logout" (click)="onLogout()">
      <i class="pi pi-sign-out public-nav-icon" aria-hidden="true"></i>
      <span class="public-nav-label">{{ 'navigation.logout' | translate }}</span>
    </button>
  </nav>
</aside>
