<div class="customer-form-page">
  <a routerLink="/customers" class="customer-form-back">
    <i class="pi pi-arrow-right" aria-hidden="true"></i>
    לקוחות
  </a>

  <h1 class="customer-form-title">לקוחה חדשה</h1>

  <div class="customers-card customer-form-card">
    <form class="customer-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="customer-form-field">
        <label for="name">שם</label>
        <input
          id="name"
          type="text"
          formControlName="name"
          class="customer-form-input"
          [class.customer-form-input-invalid]="name?.invalid && (name?.touched || name?.dirty)"
        />
        @if (name?.invalid && (name?.touched || name?.dirty)) {
          <p class="customer-form-error">יש להזין שם.</p>
        }
      </div>

      <div class="customer-form-field">
        <label for="phone">טלפון</label>
        <input
          id="phone"
          type="text"
          dir="ltr"
          formControlName="phone"
          class="customer-form-input customer-form-input-ltr"
          [class.customer-form-input-invalid]="phone?.invalid && (phone?.touched || phone?.dirty)"
        />
        @if (phone?.invalid && (phone?.touched || phone?.dirty)) {
          <p class="customer-form-error">יש להזין מספר טלפון.</p>
        }
      </div>

      <div class="customer-form-field">
        <label for="email">אימייל</label>
        <input
          id="email"
          type="email"
          dir="ltr"
          formControlName="email"
          class="customer-form-input customer-form-input-ltr"
        />
      </div>

      <div class="customer-form-field">
        <label for="notes">הערות</label>
        <textarea
          id="notes"
          formControlName="notes"
          class="customer-form-input customer-form-textarea"
          rows="3"
        ></textarea>
      </div>

      @if (serverError()) {
        <p class="customer-form-error customer-form-error-server">{{ serverError() }}</p>
      }

      <div class="customer-form-actions">
        <button
          type="submit"
          class="customers-btn customers-btn-primary"
          [disabled]="form.invalid || loading()"
        >
          {{ loading() ? 'שומרת…' : 'יצירת לקוחה' }}
        </button>
        <a routerLink="/customers" class="customers-btn customers-btn-ghost">ביטול</a>
      </div>
    </form>
  </div>
</div>
