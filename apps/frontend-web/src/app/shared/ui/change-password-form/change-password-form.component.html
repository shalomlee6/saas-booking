<form [formGroup]="form" (ngSubmit)="submit()" class="cpf-form">
  <div class="cpf-field">
    <label for="cpfCurrentPassword">{{ t('settings.currentPasswordLabel') }}</label>
    <input
      id="cpfCurrentPassword"
      type="password"
      dir="ltr"
      autocomplete="current-password"
      formControlName="currentPassword"
      class="cpf-input"
    />
  </div>

  <div class="cpf-field">
    <label for="cpfNewPassword">{{ t('settings.newPasswordLabel') }}</label>
    <input
      id="cpfNewPassword"
      type="password"
      dir="ltr"
      autocomplete="new-password"
      formControlName="newPassword"
      class="cpf-input"
    />
  </div>

  <div class="cpf-field">
    <label for="cpfConfirmPassword">{{ t('settings.confirmPasswordLabel') }}</label>
    <input
      id="cpfConfirmPassword"
      type="password"
      dir="ltr"
      autocomplete="new-password"
      formControlName="confirmPassword"
      class="cpf-input"
    />
  </div>

  @if (errorMessage()) {
    <p class="cpf-message cpf-message--error" role="alert">{{ errorMessage() }}</p>
  }
  @if (successMessage()) {
    <p class="cpf-message cpf-message--success" role="status">{{ successMessage() }}</p>
  }

  <div class="cpf-actions">
    <button type="submit" class="cpf-btn" [disabled]="saving()">
      {{ saving() ? t('common.saving') : t('settings.changePasswordButton') }}
    </button>
  </div>
</form>
